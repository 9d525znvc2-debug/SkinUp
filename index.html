<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkinUp</title>
<style>
  :root {
    --bg: #12161c; --panel: #1a2029; --text: #fff;
    --muted: #8b96a5; --yellow: #ffd12e; --orange: #ff7a00;
    --red: #eb4b4b; --green: #32d74b; --border: #30363d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 80px; }
  
  /* ШАПКА */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #0d1117; border-bottom: 1px solid #1f2733; position: sticky; top: 0; z-index: 50; }
  .logo { font-size: 22px; font-weight: 800; } .logo span { color: var(--yellow); }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .balance { background: #161b22; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .balance strong { color: var(--yellow); font-size: 15px; }
  .auth-btn { background: var(--yellow); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .user-profile { display: none; align-items: center; gap: 8px; cursor: pointer; background: #161b22; padding: 4px 10px 4px 4px; border-radius: 20px; border: 1px solid var(--border); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; justify-content: center; align-items: center; font-weight: 800; }
  .username { font-size: 13px; font-weight: 600; }
  
  /* ОСНОВА */
  .main { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; width: 100%; }
  .page-section { display: none; width: 100%; } .page-section.active { display: block; }
  
  /* АПГРЕЙД */
  .up-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
  .up-tab { flex: 1; background: #161b22; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; transition: 0.2s; }
  .up-tab.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  
  .up-battleground { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; margin-bottom: 20px; }
  .up-slot { flex: 1; background: #161b22; border: 2px dashed var(--border); border-radius: 12px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; cursor: pointer; }
  .up-slot.filled { border-color: var(--yellow); border-style: solid; }
  .up-slot img { max-width: 100%; max-height: 60px; object-fit: contain; }
  .up-slot .name { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: center; }
  .up-slot .price { font-size: 12px; font-weight: bold; color: var(--yellow); }
  .up-arrow { font-size: 24px; color: var(--muted); }
  
  .wheel { position: relative; width: 160px; height: 160px; border-radius: 50%; border: 8px solid #1f2733; margin: 20px auto; display: block; }
  .circle { position: absolute; inset: 0; border-radius: 50%; background: #232b36; overflow: hidden; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(180deg, #ffea00 0%, var(--orange) 100%); transition: height 0.3s; }
  .wheel-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 2; width: 100%; }
  .wheel-text .percent { font-size: 24px; font-weight: 800; color: #fff; } .wheel-text .chance { font-size: 10px; color: #ccc; }
  .arrow-container { position: absolute; inset: -8px; pointer-events: none; z-index: 5; transform-origin: center center; }
  .arrow { position: absolute; top: 0; left: 50%; width: 14px; height: 18px; margin-left: -7px; clip-path: polygon(0% 0%, 100% 0%, 50% 100%); background: #fff; }
  
  .multipliers { display: flex; gap: 8px; width: 100%; margin-bottom: 20px; }
  .mult-btn { flex: 1; background: #161b22; border: 1px solid var(--border); color: var(--muted); padding: 8px 0; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .mult-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  
  .action-area { position: relative; height: 60px; display: flex; width: 100%; gap: 10px; margin-bottom: 20px; }
  .btn-main { flex: 1; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; color: #000; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); cursor: pointer; text-transform: uppercase; }
  .btn-main:disabled { opacity: 0.5; filter: grayscale(0.5); }
  .btn-light { width: 60px; height: 60px; border-radius: 12px; background: #1f2733; border: 1px solid var(--border); color: var(--muted); font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .btn-light.active { color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 15px rgba(255,209,46,0.3); }
  
  /* БУТЫЛОЧКА */
  .bottle-layout { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; }
  .bets-panel, .chances-panel { flex: 1; background: #161b22; border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bets-panel h3 { grid-column: span 2; font-size: 12px; margin-bottom: 5px; color: var(--muted); display: flex; justify-content: space-between; }
  .bet-slot-mini { height: 70px; border-radius: 8px; background: #12161c; border: 1px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .bet-slot-mini img { max-width: 50px; max-height: 35px; object-fit: contain; }
  .bet-slot-mini .b-price { font-size: 10px; color: var(--yellow); }
  .bet-slot-mini.filled { border-style: solid; border-color: var(--yellow); }
  .bet-slot-mini .remove-btn { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; }
  .chance-box { height: 70px; border-radius: 8px; background: #12161c; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .chance-box img { max-width: 50px; max-height: 35px; object-fit: contain; }
  .chance-box .c-percent { font-size: 11px; font-weight: bold; }
  .chance-box.win .c-percent { color: var(--green); } .chance-box.lose .c-percent { color: var(--red); }
  .bets-sum-text { text-align: center; font-size: 14px; font-weight: bold; color: var(--yellow); grid-column: span 2; margin-top: 5px; }
  
  .bottle-center { display: flex; flex-direction: column; align-items: center; margin: 20px 0; }
  /* ОГРОМНАЯ БУТЫЛКА ЗДЕСЬ */
  .bottle-svg { width: 140px; height: 180px; fill: var(--yellow); filter: drop-shadow(0 0 30px rgba(255,209,46,0.6)); transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1); }
  .spin-btn-row { display: flex; gap: 10px; width: 100%; max-width: 300px; margin-top: 20px; }
  .spin-btn { flex: 1; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; }
  .spin-btn:disabled { opacity: 0.5; filter: grayscale(0.5); }

  /* МАГАЗИН */
  .shop-section { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-top: 15px; }
  .inv-tabs { display: flex; gap: 10px; margin-bottom: 15px; background: #12161c; padding: 4px; border-radius: 8px; }
  .inv-tab { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 6px; }
  .inv-tab.active { background: #30363d; color: #fff; }
  .search-box { display: flex; align-items: center; background: #12161c; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
  .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; }
  .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; min-height: 200px; }
  .skin-card { background: #161b22; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: left; display: flex; flex-direction: column; position: relative; cursor: pointer; }
  .skin-card::after { content: ''; position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: #ff3b3b; border-radius: 2px; }
  .skin-image { height: 50px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
  .skin-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .skin-name { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-subname { font-size: 11px; font-weight: 700; color: #ff5c5c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-price { color: var(--yellow); font-weight: 700; font-size: 11px; margin-top: auto; text-align: right; }

  /* НАВИГАЦИЯ */
  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #0d1117; border-top: 1px solid #1f2733; display: flex; justify-content: space-around; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; gap: 2px; cursor: pointer; width: 33.33%; }
  .nav-item svg { width: 22px; height: 22px; fill: currentColor; } .nav-item.active { color: var(--yellow); }

  /* МОДАЛКИ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; visibility: hidden; transition: 0.3s; padding: 20px; }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal { background: #1a2029; width: 100%; max-width: 340px; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
  .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: var(--muted); }
  .auth-tab.active { color: var(--yellow); border-bottom: 2px solid var(--yellow); }
  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-form input { width: 100%; padding: 12px; background: #12161c; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; }
  .btn-save { width: 100%; background: var(--yellow); color: #000; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  
  .buy-modal-img { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
  .buy-modal-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .buy-modal-name { font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; }
  .buy-modal-subname { font-size: 18px; font-weight: 800; color: #ff5c5c; text-align: center; margin-bottom: 5px; text-transform: uppercase; }
  .buy-modal-price { font-size: 16px; font-weight: 800; color: var(--yellow); text-align: center; margin-bottom: 15px; }
  .buy-actions { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
  .buy-qty-btn { width: 35px; height: 35px; border-radius: 50%; background: #30363d; color: #fff; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
  .buy-qty-val { font-size: 18px; font-weight: bold; }
  .buy-pay-btn { width: 100%; background: var(--yellow); color: #000; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .buy-back-btn { width: 100%; background: #30363d; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="switchTab('upgrade')">Skin<span>Up</span></div>
    <div class="header-actions">
      <div class="balance">Баланс: <strong id="balanceVal">0</strong> G</div>
      <button class="auth-btn" id="headerLoginBtn">Войти</button>
      <div class="user-profile" id="headerUserProfile">
        <div class="avatar" id="userAvatar">U</div>
        <div class="username" id="userName">User</div>
      </div>
    </div>
  </header>

  <!-- КЕЙСЫ -->
  <main class="main page-section" id="page-cases">
    <h1 style="font-size: 20px; margin-bottom: 15px;">Кейсы</h1>
    <div class="skin-grid">
      <div class="skin-card" style="padding: 15px; text-align: center;">
        <img src="https://standoff.gg/storage/cases/standoff_case.png" style="width:100%; height:80px; object-fit:contain;">
        <div class="skin-price" style="text-align:center; margin-top:10px;">19 G</div>
        <div class="skin-name" style="color:#fff; font-size:12px;">M4A1 Bubblegum</div>
      </div>
      <div class="skin-card" style="padding: 15px; text-align: center;">
        <img src="https://standoff.gg/storage/cases/standoff_case.png" style="width:100%; height:80px; object-fit:contain;">
        <div class="skin-price" style="text-align:center; margin-top:10px;">65 G</div>
        <div class="skin-name" style="color:#fff; font-size:12px;">Famas Fury</div>
      </div>
    </div>
  </main>

  <!-- АПГРЕЙД -->
  <main class="main page-section active" id="page-upgrade">
    <h1 style="font-size: 20px; margin-bottom: 15px;">Апгрейдер</h1>
    
    <div class="up-tabs">
      <div class="up-tab active" id="tabBetBtn" onclick="switchUpTab('bet')">Ваш инвентарь</div>
      <div class="up-tab" id="tabTargetBtn" onclick="switchUpTab('target')">Прокачать до</div>
    </div>

    <div class="up-battleground">
      <div class="up-slot" id="betSlot" onclick="switchUpTab('bet')">
        <span style="color:var(--muted); font-size:11px;">Выберите скин</span>
      </div>
      <div class="up-arrow">➜</div>
      <div class="up-slot" id="targetSlot" onclick="switchUpTab('target')">
        <span style="color:var(--muted); font-size:11px;">Выберите цель</span>
      </div>
    </div>

    <!-- КОЛЕСО ТЕПЕРЬ ВСЕГДА ВИДНО -->
    <div class="wheel" id="upWheel">
      <div class="circle">
        <div class="fill" id="upFill" style="height: 0%;"></div>
        <div class="wheel-text">
          <div class="percent" id="upPercent">0%</div>
          <div class="chance">шанс</div>
        </div>
      </div>
      <div class="arrow-container" id="upArrow"><div class="arrow"></div></div>
    </div>

    <!-- МНОЖИТЕЛИ ТЕПЕРЬ ВСЕГДА ВИДНЫ -->
    <div class="multipliers">
      <button class="mult-btn" data-mult="1.3">x1.3</button>
      <button class="mult-btn active" data-mult="2">x2</button>

      <button class="mult-btn" data-mult="4">x4</button>
      <button class="mult-btn" data-mult="5">x5</button>
    </div>

    <div class="action-area" id="actionArea">
      <button class="btn-main" id="upgradeBtn" disabled>Прокачать</button>
      <button class="btn-light active" id="upgradeLightning" onclick="toggleLightning('upgrade')">⚡</button>
    </div>

    <div class="shop-section" id="shopUpgrade">
      <div class="inv-tabs">
        <div class="inv-tab active" id="invTabBtnUp" onclick="switchShopTab('inv', 'upgrade')">Инвентарь</div>
        <div class="inv-tab" id="shopTabBtnUp" onclick="switchShopTab('shop', 'upgrade')">Магазин</div>
      </div>
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Поиск..." id="searchInputUp" oninput="renderItems('upgrade')"></div>
      <div id="invContentUp"><div class="skin-grid" id="invGridUp"></div></div>
      <div id="shopContentUp" style="display: none;"><div class="skin-grid" id="shopGridUp"></div></div>
    </div>
  </main>

  <!-- БУТЫЛКА -->
  <main class="main page-section" id="page-bottle">

    <div class="bottle-layout">
      <div class="bets-panel">
        <h3>Ставка <span id="betsCount">0/6</span></h3>
        <div id="betsSlots" style="display: contents;"></div>
        <div class="bets-sum-text">Сумма: <span id="betsSum">0</span> G</div>
      </div>
      <div class="chances-panel" id="chancesPanel">
        <!-- Скины с шансами -->
      </div>
    </div>

    <div class="bottle-center">
      <!-- ОГРОМНАЯ БУТЫЛКА -->
      <svg class="bottle-svg" id="bottleSvg" viewBox="0 0 24 24"><path d="M11 2h2v4.5l2.5 2.5c.4.4.5.9.5 1.5v9c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-9c0-.6.2-1.1.5-1.5L11 6.5V2zm-1 8.5v9h4v-9h-4z"/></svg>
      <div class="spin-btn-row">
        <button class="spin-btn" id="spinBottleBtn" disabled>Крутить</button>
        <button class="btn-light active" id="bottleLightning" onclick="toggleLightning('bottle')">⚡</button>

    </div>

    <div class="shop-section" id="shopBottle">
      <div class="inv-tabs">
        <div class="inv-tab active" id="invTabBtnBtl" onclick="switchShopTab('inv', 'bottle')">Инвентарь</div>
        <div class="inv-tab" id="shopTabBtnBtl" onclick="switchShopTab('shop', 'bottle')">Магазин</div>
      </div>
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Поиск..." id="searchInputBtl" oninput="renderItems('bottle')"></div>
      <div id="invContentBtl"><div class="skin-grid" id="invGridBtl"></div></div>
      <div id="shopContentBtl" style="display: none;"><div class="skin-grid" id="shopGridBtl"></div></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" onclick="switchTab('cases')" id="nav-cases"><svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg><span>Кейсы</span></a>
    <a class="nav-item active" onclick="switchTab('upgrade')" id="nav-upgrade"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg><span>Апгрейд</span></a>
    <a class="nav-item" onclick="switchTab('bottle')" id="nav-bottle"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>Бутылка</span></a>
  </nav>

  <!-- МОДАЛКИ -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <div class="modal-header"><h2>Аккаунт</h2><button class="close-btn" onclick="closeModal('authModal')">×</button></div>

    </div>

  <div class="modal-overlay" id="buyModal">
    <div class="modal">
      <div class="buy-modal-img" id="buyModalImgContainer"></div>
      <div class="buy-modal-name" id="buyModalName"></div>
      <div class="buy-modal-subname" id="buyModalSub"></div>
      <div class="buy-modal-price" id="buyModalPrice">0 G</div>
      <div class="buy-actions">
        <button class="buy-qty-btn" onclick="changeQty(-1)">-</button>
        <div class="buy-qty-val" id="buyQtyVal">1</div>
        <button class="buy-qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <button class="buy-pay-btn" id="buyPayBtn" onclick="confirmBuy()">Оплатить <span id="buyTotalPrice"></span></button>
      <button class="buy-back-btn" onclick="closeModal('buyModal')">Назад</button>
    </div>
  </div>

document.addEventListener('DOMContentLoaded', () => {
  
  const allSkins = [

    { name: "AWM", sub: "Vampire", price: 2494.00, img: "images/awm-vampire.png" },
    { name: "Butterfly", sub: "Starfall", price: 1820.00, img: "images/butterfly-starfall.png" },
    { name: "Karambit", sub: "Hologram", price: 2300.00, img: "images/karambit-hologram.png" },
    { name: "AWM", sub: "2 Years Red", price: 16500.00, img: "images/awm-2-years-red.png" }
  ];

  let state = {
    currentUser: null,
    users: JSON.parse(localStorage.getItem('skinup_users')) || {},
    upBet: null, upTarget: null, isSpinningUp: false, isFastUp: true,
    bottleBet: [], bottleSlots: [], isSpinningBtl: false, isFastBtl: true,
    currentBuySkin: null, buyQty: 1, currentPage: 'upgrade', currentUpTab: 'bet'
  };

  const savedSession = localStorage.getItem('skinup_session');
  if (savedSession && state.users[savedSession]) state.currentUser = savedSession;

  function saveUsers() { localStorage.setItem('skinup_users', JSON.stringify(state.users)); }

  // Звуки
  let audioCtx = null;
  function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playTick() {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }
  function playWin() {
    if(!audioCtx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle'; osc.frequency.value = f;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      }, i * 100);
    });
  }

  function updateUI() {
    if (state.currentUser) {
      document.getElementById('balanceVal').textContent = Math.round(state.users[state.currentUser].balance);
      document.getElementById('headerLoginBtn').style.display = 'none';
      document.getElementById('headerUserProfile').style.display = 'flex';
      document.getElementById('userName').textContent = state.currentUser;
      document.getElementById('userAvatar').textContent = state.currentUser.charAt(0).toUpperCase();
    } else {
      document.getElementById('balanceVal').textContent = '0';
      document.getElementById('headerLoginBtn').style.display = 'block';
      document.getElementById('headerUserProfile').style.display = 'none';
    }
    updateUpgradeUI();
    updateBottleUI();
    renderItems(state.currentPage);
  }

  window.switchTab = (tabId) => {
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`page-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');
    state.currentPage = tabId;
  };

  // --- АПГРЕЙД ЛОГИКА ---
  window.switchUpTab = (tab) => {
    state.currentUpTab = tab;
    document.getElementById('tabBetBtn').classList.toggle('active', tab === 'bet');
    document.getElementById('tabTargetBtn').classList.toggle('active', tab === 'target');
    switchShopTab('shop', 'upgrade');
  };

  function updateUpgradeUI() {
    const betSlot = document.getElementById('betSlot');
    const targetSlot = document.getElementById('targetSlot');
    const wheel = document.getElementById('upWheel');
    const btn = document.getElementById('upgradeBtn');

    if (state.upBet) {
      betSlot.innerHTML = `<img src="${state.upBet.img}"><div class="name">${state.upBet.name}</div><div class="price">${state.upBet.price.toFixed(0)} G</div>`;
      betSlot.classList.add('filled');
    } else {
      betSlot.innerHTML = `<span style="color:var(--muted); font-size:11px;">Выберите скин</span>`;
      betSlot.classList.remove('filled');
    }

    if (state.upTarget) {
      targetSlot.innerHTML = `<img src="${state.upTarget.img}"><div class="name">${state.upTarget.name}</div><div class="price">${state.upTarget.price.toFixed(0)} G</div>`;
      targetSlot.classList.add('filled');
    } else {
      targetSlot.innerHTML = `<span style="color:var(--muted); font-size:11px;">Выберите цель</span>`;
      targetSlot.classList.remove('filled');
    }

    if (state.upBet && state.upTarget) {
      let chance = (state.upBet.price / state.upTarget.price) * 100;
      if (chance > 100) chance = 100;
      document.getElementById('upPercent').textContent = `${chance.toFixed(1)}%`;
      document.getElementById('upFill').style.height = `${chance}%`;
      btn.disabled = state.isSpinningUp;
    } else {
      document.getElementById('upPercent').textContent = `0%`;
      document.getElementById('upFill').style.height = `0%`;
      btn.disabled = true;
    }
  }

  window.toggleLightning = (type) => {
    if (type === 'upgrade') {
      state.isFastUp = !state.isFastUp;
      document.getElementById('upgradeLightning').classList.toggle('active', state.isFastUp);
    } else {
      state.isFastBtl = !state.isFastBtl;
      document.getElementById('bottleLightning').classList.toggle('active', state.isFastBtl);
    }
  };

  // --- БУТЫЛОЧКА ЛОГИКА ---
  const btlChances = [23, 23, 23, 20, 10, 1];
  
  function updateBottleUI() {
    const slotsContainer = document.getElementById('betsSlots');
    slotsContainer.innerHTML = '';
    
    for (let i = 0; i < 6; i++) {
      const div = document.createElement('div');
      div.className = `bet-slot-mini ${state.bottleBet[i] ? 'filled' : ''}`;
      if (state.bottleBet[i]) {
        div.innerHTML = `<img src="${state.bottleBet[i].img}"><div class="b-price">${state.bottleBet[i].price.toFixed(0)} G</div><button class="remove-btn" onclick="removeBtlBet(${i})">×</button>`;
      } else {
        div.innerHTML = `<span style="font-size:20px; color:#30363d;">+</span>`;
        div.onclick = () => switchShopTab('inv', 'bottle');
      }
      slotsContainer.appendChild(div);
    }

    const sum = state.bottleBet.reduce((s, i) => s + i.price, 0);
    document.getElementById('betsSum').textContent = sum.toFixed(0);
    document.getElementById('betsCount').textContent = `${state.bottleBet.length}/6`;

    if (state.bottleBet.length === 6) {
      state.bottleSlots = btlChances.map(chance => {
        const targetPrice = sum * (chance / 100);
        let closest = allSkins[0];
        let minDiff = Infinity;
        allSkins.forEach(skin => {
          const diff = Math.abs(skin.price - targetPrice);
          if (diff < minDiff) { minDiff = diff; closest = skin; }
        });
        return closest;
      });
      
      const panel = document.getElementById('chancesPanel');
      panel.innerHTML = '';
      btlChances.forEach((chance, i) => {
        const skin = state.bottleSlots[i];
        panel.innerHTML += `
          <div class="chance-box ${chance > 15 ? 'win' : 'lose'}">
            <img src="${skin.img}" onerror="this.style.display='none'">
            <div class="c-percent">${chance}%</div>
          </div>
        `;
      });
      document.getElementById('spinBottleBtn').disabled = state.isSpinningBtl;
    } else {
      document.getElementById('chancesPanel').innerHTML = '<div style="grid-column: span 2; text-align:center; color:#8b96a5; font-size:12px; padding-top:20px;">Выберите 6 скинов</div>';
      document.getElementById('spinBottleBtn').disabled = true;
    }
  }

  window.removeBtlBet = (idx) => {
    state.bottleBet.splice(idx, 1);
    updateUI();
  };

  // --- МАГАЗИН ---
  window.switchShopTab = (tab, page) => {
    const invBtn = document.getElementById(page === 'upgrade' ? 'invTabBtnUp' : 'invTabBtnBtl');
    const shopBtn = document.getElementById(page === 'upgrade' ? 'shopTabBtnUp' : 'shopTabBtnBtl');
    const invContent = document.getElementById(page === 'upgrade' ? 'invContentUp' : 'invContentBtl');
    const shopContent = document.getElementById(page === 'upgrade' ? 'shopContentUp' : 'shopContentBtl');
    
    if (tab === 'inv') {
      invBtn.classList.add('active'); shopBtn.classList.remove('active');
      invContent.style.display = 'block'; shopContent.style.display = 'none';
    } else {
      shopBtn.classList.add('active'); invBtn.classList.remove('active');
      invContent.style.display = 'none'; shopContent.style.display = 'block';
    }
    renderItems(page);
  };

  function renderItems(page) {
    const isInv = page === 'upgrade' ? document.getElementById('invContentUp').style.display !== 'none' : document.getElementById('invContentBtl').style.display !== 'none';
    const grid = document.getElementById(page === 'upgrade' ? (isInv ? 'invGridUp' : 'shopGridUp') : (isInv ? 'invGridBtl' : 'shopGridBtl'));
    const searchInput = document.getElementById(page === 'upgrade' ? 'searchInputUp' : 'searchInputBtl');
    
    if(!searchInput || !grid) return;
    
    const search = searchInput.value.toLowerCase();
    grid.innerHTML = '';

    let items = [];
    if (isInv) {
      if (!state.currentUser) { grid.innerHTML = '<p style="color:var(--muted); text-align:center; width:100%;">Войдите</p>'; return; }
      items = state.users[state.currentUser].inventory;
    } else {
      items = allSkins;
    }

    if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || i.sub.toLowerCase().includes(search));

    items.forEach((skin, idx) => {
      const card = document.createElement('div');
      card.className = 'skin-card';
      
      card.onclick = () => {
        if (isInv) {
          if (page === 'upgrade') {
            if (state.currentUpTab === 'bet') {
              if (state.upBet) state.users[state.currentUser].inventory.push(state.upBet);
              state.upBet = skin;
              state.users[state.currentUser].inventory.splice(idx, 1);
              switchUpTab('target');
            } else {
              state.upTarget = skin;
              switchUpTab('bet');
            }
          } else {
            if (state.bottleBet.length >= 6) return alert('Максимум 6 скинов!');
            state.bottleBet.push(skin);
            state.users[state.currentUser].inventory.splice(idx, 1);
          }
        } else {
          if (page === 'upgrade' && state.currentUpTab === 'target') {
             state.upTarget = skin;
             switchUpTab('bet');
          } else {
             window.openBuyModal(skin);
          }
        }
        saveUsers();
        updateUI();
      };

      card.innerHTML = `
        <div class="skin-image"><img src="${skin.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0xNCA0bC0yIDItMy0zLTItMi01IDUgMiA1IDMgMyAyLTJ6Ii8+PC9zdmc+'"></div>
        <div class="skin-name">${skin.name}</div>
        <div class="skin-subname">${skin.sub}</div>
        <div class="skin-price">${skin.price.toFixed(0)} G</div>
      `;
      grid.appendChild(card);
    });
  }

  // --- ПОКУПКА ---
  window.openBuyModal = (skin) => {
    if (!state.currentUser) return alert('Войдите в аккаунт!');
    state.currentBuySkin = skin;
    state.buyQty = 1;
    
    document.getElementById('buyModalImgContainer').innerHTML = `<img src="${skin.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0xNCA0bC0yIDItMy0zLTItMi01IDUgMiA1IDMgMyAyLTJ6Ii8+PC9zdmc+'">`;
    document.getElementById('buyModalName').textContent = skin.name;
    document.getElementById('buyModalSub').textContent = skin.sub;
    document.getElementById('buyModalPrice').textContent = `${skin.price.toFixed(0)} G`;
    updateBuyModalQty();
    openModal('buyModal');
  };

  window.changeQty = (dir) => {
    state.buyQty = Math.max(1, state.buyQty + dir);
    updateBuyModalQty();
  };

  function updateBuyModalQty() {
    document.getElementById('buyQtyVal').textContent = state.buyQty;
    const total = state.currentBuySkin.price * state.buyQty;
    document.getElementById('buyTotalPrice').textContent = `(${total.toFixed(0)} G)`;
  }

  window.confirmBuy = () => {
    const total = state.currentBuySkin.price * state.buyQty;
    if (state.users[state.currentUser].balance < total) return alert('Не хватает баланса!');
    state.users[state.currentUser].balance -= total;
    for(let i=0; i<state.buyQty; i++) state.users[state.currentUser].inventory.push(state.currentBuySkin);
    saveUsers();
    updateUI();
    closeModal('buyModal');
  };

  // --- КНОПКИ ---
  document.getElementById('upgradeBtn').addEventListener('click', () => {
    if (state.isSpinningUp || !state.upBet || !state.upTarget) return;
    initAudio();
    state.isSpinningUp = true;
    
    let chance = (state.upBet.price / state.upTarget.price) * 100;
    if (chance > 100) chance = 100;
    const isWin = Math.random() * 100 < chance;
    const duration = state.isFastUp ? 500 : 3000;

    const arrow = document.getElementById('upArrow');
    arrow.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.8, 0.2, 1)`;
    
    const spins = state.isFastUp ? 2 : 5;
    arrow.style.transform = `rotate(${spins * 360 + (isWin ? 180 : 0)}deg)`;
    
    document.getElementById('upgradeBtn').textContent = 'Крутим...';
    
    // Тики
    let ticks = 0;
    const tickInterval = setInterval(() => {
      if(!state.isFastUp) playTick();
      ticks++;
      if (ticks > (state.isFastUp ? 2 : 20)) clearInterval(tickInterval);
    }, 100);

    setTimeout(() => {
      clearInterval(tickInterval);
      arrow.style.transition = 'none';
      arrow.style.transform = 'rotate(0deg)';
      
      if (isWin) {
        playWin();
        state.users[state.currentUser].inventory.push(state.upTarget);
        alert(`Победа! Получен ${state.upTarget.name}`);
      } else {
        alert(`Поражение`);
      }

      state.upBet = null;
      state.upTarget = null;
      state.isSpinningUp = false;
      saveUsers();
      
      document.getElementById('upgradeBtn').textContent = 'Прокачать';
      updateUI();
    }, duration);
  });

  document.getElementById('spinBottleBtn').addEventListener('click', () => {
    if (state.isSpinningBtl || state.bottleBet.length !== 6) return;
    initAudio();
    state.isSpinningBtl = true;
    
    const totalBet = state.bottleBet.reduce((s, i) => s + i.price, 0);
    const rand = Math.random() * 100;
    let winIndex = 0;
    let sum = 0;
    for(let i=0; i<btlChances.length; i++) {
      sum += btlChances[i];
      if (rand <= sum) { winIndex = i; break; }
    }

    const bottle = document.getElementById('bottleSvg');
    const targetAngle = winIndex * 60;
    const duration = state.isFastBtl ? 500 : 4000;
    
    bottle.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.8, 0.2, 1)`;
    bottle.style.transform = `rotate(${targetAngle + (360 * (state.isFastBtl ? 2 : 5))}deg)`;

    setTimeout(() => {
      state.isSpinningBtl = false;
      bottle.style.transition = 'none';
      bottle.style.transform = `rotate(${targetAngle}deg)`;
      
      const wonSkin = state.bottleSlots[winIndex];
      const isWin = wonSkin.price > totalBet;
      
      if (isWin) {
        playWin();
        state.users[state.currentUser].inventory.push(wonSkin);
      }
      
      alert(isWin ? `ПОБЕДА! Выиграли ${wonSkin.name}` : `ПОРАЖЕНИЕ. Выпал ${wonSkin.name}`);
      
      state.bottleBet = [];
      saveUsers();
      updateUI();
    }, duration + 100);
  });

  // --- АВТОРИЗАЦИЯ ---
  window.openModal = (id) => document.getElementById(id).classList.add('active');
  window.closeModal = (id) => document.getElementById(id).classList.remove('active');

  document.getElementById('headerLoginBtn').addEventListener('click', () => openModal('authModal'));
  
  document.getElementById('tabLogin').addEventListener('click', () => {
    document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
    document.getElementById('loginForm').style.display = 'flex'; document.getElementById('registerForm').style.display = 'none';
  });
  document.getElementById('tabRegister').addEventListener('click', () => {
    document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('registerForm').style.display = 'flex'; document.getElementById('loginForm').style.display = 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('loginNick').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!state.users[nick] || state.users[nick].pass !== pass) return alert('Неверный ник или пароль!');
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('regNick').value.trim();
    const pass = document.getElementById('regPass').value;
    if (state.users[nick]) return alert('Этот ник уже занят!');
    state.users[nick] = { pass: pass, balance: 1000, inventory: [] };
    saveUsers();
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  updateUI();
});
</script>
</body>
</html>
