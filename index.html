<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkinUp - Апгрейдер</title>
<style>
  :root {
    --bg-color: #12161c; --panel-bg: #1a2029; --text-main: #ffffff;
    --text-muted: #8b96a5; --yellow: #ffd12e; --orange: #ff7a00;
    --red: #eb4b4b; --green: #32d74b; --border-color: #30363d;
    --nav-bg: #0d1117; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 90px; }
  
  /* ШАПКА */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--nav-bg); border-bottom: 1px solid #1f2733; position: sticky; top: 0; z-index: 50; }
  .logo { font-size: 22px; font-weight: 800; cursor: pointer; } .logo span { color: var(--yellow); }
  .header-actions { display: flex; align-items: center; gap: 12px; position: relative; }
  .balance-box { background: #161b22; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; color: var(--text-muted); }
  .balance-box strong { color: var(--yellow); font-size: 15px; }
  .auth-btn-header { background: var(--yellow); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .user-profile-btn { display: none; align-items: center; gap: 8px; cursor: pointer; background: #161b22; padding: 4px 10px 4px 4px; border-radius: 20px; border: 1px solid var(--border-color); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; justify-content: center; align-items: center; font-weight: 800; }
  .username { font-size: 13px; font-weight: 600; }
  .profile-dropdown { position: absolute; top: 45px; right: 0; width: 180px; background: #1a2029; border: 1px solid var(--border-color); border-radius: 12px; display: none; z-index: 60; }
  .profile-dropdown.active { display: block; }
  .dropdown-item { padding: 12px 16px; font-size: 14px; cursor: pointer; } .dropdown-item.danger { color: var(--red); }
  .settings-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
  
  /* ОСНОВА */
  .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; max-width: 900px; margin: 0 auto; width: 100%; }
  .title { font-size: 22px; font-weight: 700; text-align: center; } .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; text-align: center; }
  
  /* АПГРЕЙД (Колесо) */
  .wheel-container { position: relative; width: 220px; height: 220px; margin-bottom: 30px; border-radius: 50%; border: 10px solid #1f2733; }
  .circle { position: absolute; inset: 0; border-radius: 50%; background: #232b36; overflow: hidden; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(180deg, #ffea00 0%, var(--orange) 100%); transition: height 0.3s; }
  .wheel-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 2; width: 100%; }
  .wheel-text .percent { font-size: 32px; font-weight: 800; color: #fff; } .wheel-text .chance { font-size: 11px; } .wheel-text .win-amount { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .arrow-container { position: absolute; inset: -10px; pointer-events: none; z-index: 5; transform-origin: center center; }
  .arrow { position: absolute; top: 0; left: 50%; width: 16px; height: 20px; margin-left: -8px; clip-path: polygon(0% 0%, 100% 0%, 50% 100%); background: #fff; }
  .controls { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; max-width: 400px; }
  .input-row { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 15px; color: var(--text-muted); }
  .chance-display { font-size: 20px; font-weight: 800; color: var(--yellow); }
  .bet-input { width: 100px; background: #12161c; border: 1px solid var(--border-color); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 15px; }
  .multipliers { display: flex; gap: 8px; }
  .mult-btn { flex: 1; background: #161b22; border: 1px solid var(--border-color); color: #c9d1d9; padding: 10px 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .mult-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  .action-area { position: relative; height: 60px; display: flex; max-width: 400px; width: 100%; }
  .action-btn { width: 100%; height: 100%; border-radius: 12px; border: none; font-size: 18px; font-weight: 700; color: #000; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); cursor: pointer; text-transform: uppercase; position: absolute; }
  .action-btn:disabled { opacity: 0.5; filter: grayscale(0.5); }
  .notification { width: 100%; height: 100%; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-weight: 700; opacity: 0; visibility: hidden; position: absolute; transition: 0.3s; }
  .action-area.show-result .action-btn { opacity: 0; visibility: hidden; }
  .action-area.show-result .notification { opacity: 1; visibility: visible; }
  .notification.win { background: rgba(50, 215, 75, 0.1); border: 1px solid var(--green); color: var(--green); }
  .notification.lose { background: rgba(255, 59, 59, 0.1); border: 1px solid var(--red); color: var(--red); }
  
  /* БУТЫЛОЧКА */
  .bottle-wrapper { position: relative; width: 100%; max-width: 320px; height: 320px; margin: 20px auto 40px; display: flex; justify-content: center; align-items: center; }
  .bottle-circle { position: absolute; width: 90%; height: 90%; border-radius: 50%; border: 1px dashed #30363d; }
  .bottle-center { position: absolute; width: 160px; height: 160px; background: radial-gradient(circle, #ffd12e 0%, #ff7a00 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 60px rgba(255, 209, 46, 0.6); z-index: 10; transition: transform 0.1s; }
  .bottle-center svg { width: 90px; height: 90px; fill: #fff; }
  .bottle-item { position: absolute; width: 60px; height: 60px; background: #1a2029; border: 1px solid var(--border-color); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 700; z-index: 5; }
  .bottle-item.win { color: var(--green); } .bottle-item.lose { color: var(--red); }
  .pos-1 { top: -10px; left: 50%; transform: translate(-50%, 0); } .pos-2 { top: 15%; right: -10px; } .pos-3 { bottom: 15%; right: -10px; } .pos-4 { bottom: -10px; left: 50%; transform: translate(-50%, 0); } .pos-5 { bottom: 15%; left: -10px; } .pos-6 { top: 15%; left: -10px; }
  .spin-bottle-btn { width: 100%; max-width: 340px; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; }
  
  /* МАГАЗИН */
  .inventory-section { width: 100%; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .inv-tabs { display: flex; gap: 10px; margin-bottom: 15px; background: #12161c; padding: 4px; border-radius: 8px; }
  .inv-tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
  .inv-tab.active { background: #30363d; color: #fff; }
  .search-box { display: flex; align-items: center; background: #12161c; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 15px; margin-bottom: 15px; }
  .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; }
  .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; min-height: 250px; }
  .skin-card { background: #161b22; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; text-align: left; display: flex; flex-direction: column; position: relative; }
  .skin-card::after { content: ''; position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: #ff3b3b; border-radius: 2px; }
  .skin-image { height: 70px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .skin-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .skin-name-wrapper { display: flex; flex-direction: column; margin-bottom: 8px; }
  .skin-name { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-subname { font-size: 13px; font-weight: 700; color: #ff5c5c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .skin-price { background: transparent; color: var(--yellow); font-weight: 700; font-size: 13px; padding: 4px 0; margin-top: auto; text-align: right; cursor: pointer; }
  
  /* НАВИГАЦИЯ */
  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--nav-bg); border-top: 1px solid #1f2733; display: flex; justify-content: space-around; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; gap: 4px; cursor: pointer; width: 33.33%; }
  .nav-item svg { width: 24px; height: 24px; fill: currentColor; } .nav-item.active { color: var(--yellow); }
  .page-section { display: none; width: 100%; flex-direction: column; align-items: center; } .page-section.active { display: flex; }
  
  /* МОДАЛКИ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; visibility: hidden; transition: 0.3s; padding: 20px; }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal { background: #1a2029; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .close-modal { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
  .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  .auth-form { display: flex; flex-direction: column; gap: 15px; }
  .auth-form input { width: 100%; padding: 14px; background: #12161c; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }
  .save-settings-btn { width: 100%; background: var(--yellow); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="switchTab('upgrade')">Skin<span>Up</span></div>
    <div class="header-actions">
      <div class="balance-box">Баланс: <strong id="balanceVal">0</strong> G</div>
      <button class="auth-btn-header" id="headerLoginBtn">Войти</button>
      <div class="user-profile-btn" id="headerUserProfile">
        <div class="avatar" id="userAvatar">U</div>
        <div class="username" id="userName">User</div>
      </div>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="dropdown-item danger" id="logoutBtn">🚪 Выйти</div>
      </div>
      <button class="settings-btn" onclick="openModal('settingsModal')">⚙️</button>
    </div>
  </header>

  <main class="main-content page-section active" id="page-upgrade">
    <h1 class="title">Апгрейдер скинов</h1>
    
    <div class="wheel-container">
      <div class="circle"><div class="fill" id="fillEl"></div><div class="wheel-text"><div class="percent" id="percentEl">50%</div><div class="chance">шанс успеха</div><div class="win-amount" id="winAmountEl">Выигрыш: 200 G</div></div></div>
      <div class="arrow-container" id="arrowContainer"><div class="arrow"></div></div>
    </div>
    
    <div class="controls">
      <div class="input-row"><span>Шанс:</span><span class="chance-display" id="chanceDisplay">50 %</span></div>
      <div class="input-row"><span>Ставка:</span><input type="number" id="betInput" value="100" min="10" step="10" class="bet-input"><span>G</span></div>
      <div class="multipliers">
        <button class="mult-btn" data-mult="1.3">x1.3</button><button class="mult-btn active" data-mult="2">x2</button><button class="mult-btn" data-mult="2.8">x2.8</button><button class="mult-btn" data-mult="4">x4</button><button class="mult-btn" data-mult="5">x5</button>
      </div>
      <div class="action-area" id="actionArea"><button class="action-btn" id="upgradeBtn" disabled>Апгрейд</button><div class="notification" id="notificationEl"></div></div>
    </div>

    <!-- МАГАЗИН ВНУТРИ АПГРЕЙДА -->
    <div class="inventory-section">
      <div class="top-bar"><h2 style="font-size:18px;">Магазин скинов</h2></div>
      
      <div class="search-box"><span style="margin-right:10px; color:#8b96a5;">🔍</span><input type="text" placeholder="Поиск..." id="searchInput" oninput="renderItems()"></div>

      <div id="shopContent">
        <div class="skin-grid" id="shopGrid"></div>
      </div>
    </div>
  </main>

  <main class="main-content page-section" id="page-bottle">
    <h1 class="title">Бутылочка</h1>
    <p class="subtitle">Испытай удачу и сорви джекпот!</p>
    <div class="bottle-wrapper">
      <div class="bottle-circle"></div>
      <div class="bottle-center" id="bottleCenter"><svg viewBox="0 0 24 24"><path d="M11 2h2v4.5l2.5 2.5c.4.4.5.9.5 1.5v9c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-9c0-.6.2-1.1.5-1.5L11 6.5V2zm-1 8.5v9h4v-9h-4z"/></svg></div>
      <div class="bottle-item pos-1 win" id="b-item-1">23%</div><div class="bottle-item pos-2 win" id="b-item-2">23%</div><div class="bottle-item pos-3 win" id="b-item-3">23%</div>

    </div>
    <button class="spin-bottle-btn" id="spinBottleBtn" disabled>КРУТИТЬ (100 G)</button>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" onclick="switchTab('upgrade')" id="nav-upgrade"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg><span>Апгрейд</span></a>
    <a class="nav-item" onclick="switchTab('bottle')" id="nav-bottle"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>Бутылка</span></a>
  </nav>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <div class="modal-header"><h2>Аккаунт</h2><button class="close-modal" onclick="closeModal('authModal')">×</button></div>
      <div class="auth-tabs"><div class="auth-tab active" id="tabLogin">Вход</div><div class="auth-tab" id="tabRegister">Регистрация</div></div>

    </div>
  </div>

    if (state.currentUser) {
      document.getElementById('balanceVal').textContent = Math.round(state.users[state.currentUser].balance);
      document.getElementById('headerLoginBtn').style.display = 'none';
      document.getElementById('headerUserProfile').style.display = 'flex';
      document.getElementById('userName').textContent = state.currentUser;
      document.getElementById('userAvatar').textContent = state.currentUser.charAt(0).toUpperCase();
    } else {
      document.getElementById('balanceVal').textContent = '0';
      document.getElementById('headerLoginBtn').style.display = 'block';
      document.getElementById('headerUserProfile').style.display = 'none';
    }
    
    const balance = state.currentUser ? state.users[state.currentUser].balance : 0;
    const canPlay = state.currentUser && balance >= state.bet && !state.isSpinningUp;
    
    document.getElementById('upgradeBtn').disabled = !canPlay;
    document.getElementById('spinBottleBtn').disabled = !state.currentUser || balance < 100 || state.isSpinningBtl;

    state.fillPercent = Math.round((100 / state.currentMult) * 10) / 10;
    document.getElementById('fillEl').style.height = `${state.fillPercent}%`;
    document.getElementById('percentEl').textContent = `${Math.floor(state.fillPercent)}%`;
    document.getElementById('chanceDisplay').textContent = `${Math.floor(state.fillPercent)} %`;
    document.getElementById('winAmountEl').textContent = `Выигрыш: ${Math.round(state.bet * state.currentMult)} G`;
    
    document.querySelectorAll('.mult-btn').forEach(btn => {
      btn.classList.toggle('active', Math.abs(parseFloat(btn.dataset.mult) - state.currentMult) < 0.01);
    });

    renderItems();
  }

  window.switchTab = (tabId) => {
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`page-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');
  };

  function renderItems() {
    const grid = document.getElementById('shopGrid');
    if(!grid) return;
    
    const search = document.getElementById('searchInput').value.toLowerCase();
    grid.innerHTML = '';

    let items = allSkins;
    if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || i.sub.toLowerCase().includes(search));

    items.forEach(skin => {
      const card = document.createElement('div');
      card.className = 'skin-card';
      card.innerHTML = `
        <div class="skin-image"><img src="${skin.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0xNCA0bC0yIDItMy0zLTItMi01IDUgMiA1IDMgMyAyLTJ6Ii8+PC9zdmc+'"></div>
        <div class="skin-name-wrapper">
          <div class="skin-name">${skin.name}</div>
          <div class="skin-subname">${skin.sub}</div>
        </div>
        <div class="skin-price" onclick="buySkin('${skin.name}', '${skin.sub}', ${skin.price}, '${skin.img}')">${skin.price.toFixed(0)} G</div>
      `;
      grid.appendChild(card);
    });
  }

  window.buySkin = (name, sub, price, img) => {
    if (!state.currentUser) return alert('Войдите в аккаунт!');
    if (state.users[state.currentUser].balance < price) return alert('Недостаточно средств!');
    
    state.users[state.currentUser].balance -= price;
    state.users[state.currentUser].inventory.push({name, sub, price, img});
    saveUsers();
    updateUI();
    alert(`Вы купили ${name} | ${sub}!`);
  };

  document.getElementById('betInput').addEventListener('input', (e) => {
    state.bet = Math.max(10, parseInt(e.target.value) || 10);
    updateUI();
  });

  document.querySelectorAll('.mult-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.isSpinningUp) return;
      state.currentMult = parseFloat(btn.dataset.mult);
      document.getElementById('arrowContainer').style.transform = 'rotate(0deg)';
      updateUI();
    });
  });

  document.getElementById('upgradeBtn').addEventListener('click', () => {
    if (state.isSpinningUp || !state.currentUser) return;
    state.isSpinningUp = true;
    document.getElementById('actionArea').classList.remove('show-result');
    state.users[state.currentUser].balance -= state.bet;
    saveUsers();
    updateUI();

    const isWin = Math.random() * 100 < state.fillPercent;
    const arc = state.fillPercent / 100 * 360;
    const halfArc = arc / 2;
    
    let targetAngle = isWin ? 180 + (Math.random() * arc - halfArc) : (Math.random() * (360 - arc) - (360 - arc) / 2);
    const totalRotation = (4 * 360) + targetAngle;
    const startTime = performance.now();

    function animate(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / 3000, 1);
      const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      document.getElementById('arrowContainer').style.transform = `rotate(${(totalRotation * ease) % 360}deg)`;

      if (progress < 1) requestAnimationFrame(animate);
      else finishUpgrade(isWin, targetAngle);
    }
    requestAnimationFrame(animate);
  });

  function finishUpgrade(isWin, finalAngle) {
    document.getElementById('arrowContainer').style.transform = `rotate(${finalAngle}deg)`;
    const actionArea = document.getElementById('actionArea');
    const notificationEl = document.getElementById('notificationEl');
    actionArea.classList.add('show-result');

    if (isWin) {
      const winAmount = Math.round(state.bet * state.currentMult);
      state.users[state.currentUser].balance += winAmount;
      notificationEl.textContent = `Успех! +${winAmount} G`;
      notificationEl.className = 'notification win';
    } else {
      notificationEl.textContent = `Неудача. -${state.bet} G`;
      notificationEl.className = 'notification lose';
    }

    saveUsers();
    state.isSpinningUp = false;
    updateUI();
    setTimeout(() => { if (!state.isSpinningUp) actionArea.classList.remove('show-result'); }, 2000);
  }

  document.getElementById('spinBottleBtn').addEventListener('click', () => {
    if (state.isSpinningBtl || !state.currentUser || state.users[state.currentUser].balance < 100) return;
    state.isSpinningBtl = true;
    state.users[state.currentUser].balance -= 100;
    saveUsers();
    updateUI();

    document.getElementById('spinBottleBtn').textContent = 'КРУТИМ...';
    const bottleCenter = document.getElementById('bottleCenter');
    const items = document.querySelectorAll('.bottle-item');
    
    items.forEach(i => i.style.opacity = '0.3');
    let ticks = 0;
    const interval = setInterval(() => {
      bottleCenter.style.transform = `scale(${1 + Math.random() * 0.1}) rotate(${Math.random() * 20 - 10}deg)`;
      items.forEach(i => i.style.opacity = '0.3');
      items[Math.floor(Math.random() * items.length)].style.opacity = '1';
      ticks++;

      if (ticks > 20) {
        clearInterval(interval);
        bottleCenter.style.transform = 'scale(1) rotate(0deg)';
        items.forEach(i => i.style.opacity = '1');
        
        const rand = Math.random() * 100;
        let winAmount = 0;
        if (rand < 23) winAmount = 200;
        else if (rand < 46) winAmount = 150;
        else if (rand < 69) winAmount = 120;
        else if (rand < 89) winAmount = 0;
        else if (rand < 99) winAmount = 50;
        else winAmount = 1000;

        if (winAmount > 0) {
          state.users[state.currentUser].balance += winAmount;
          saveUsers();
          alert(`Вы выиграли ${winAmount} G!`);
        } else {
          alert('Пусто! Повезет в следующий раз.');
        }

        state.isSpinningBtl = false;
        document.getElementById('spinBottleBtn').textContent = 'КРУТИТЬ (100 G)';
        updateUI();
      }
    }, 100);
  });

  window.openModal = (id) => document.getElementById(id).classList.add('active');
  window.closeModal = (id) => document.getElementById(id).classList.remove('active');

  document.getElementById('headerLoginBtn').addEventListener('click', () => openModal('authModal'));
  
  document.getElementById('tabLogin').addEventListener('click', () => {
    document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
    document.getElementById('loginForm').style.display = 'flex'; document.getElementById('registerForm').style.display = 'none';
  });
  document.getElementById('tabRegister').addEventListener('click', () => {
    document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('registerForm').style.display = 'flex'; document.getElementById('loginForm').style.display = 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('loginNick').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!state.users[nick] || state.users[nick].pass !== pass) return alert('Неверный ник или пароль!');
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('regNick').value.trim();
    const pass = document.getElementById('regPass').value;
    if (state.users[nick]) return alert('Этот ник уже занят!');
    state.users[nick] = { pass: pass, balance: 1000, inventory: [] };
    saveUsers();
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  updateUI();
});
</script>
</body>
</html>
