<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkinUp - Апгрейдер</title>
<style>
  :root {
    --bg-color: #12161c; --panel-bg: #1a2029; --text-main: #ffffff;
    --text-muted: #8b96a5; --yellow: #ffd12e; --orange: #ff7a00;
    --red: #eb4b4b; --green: #32d74b; --border-color: #30363d;
    --nav-bg: #0d1117; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 90px; }
  
  /* ШАПКА */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--nav-bg); border-bottom: 1px solid #1f2733; position: sticky; top: 0; z-index: 50; }
  .logo { font-size: 22px; font-weight: 800; cursor: pointer; } .logo span { color: var(--yellow); }
  .header-actions { display: flex; align-items: center; gap: 12px; position: relative; }
  .balance-box { background: #161b22; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; color: var(--text-muted); }
  .balance-box strong { color: var(--yellow); font-size: 15px; }
  .auth-btn-header { background: var(--yellow); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .user-profile-btn { display: none; align-items: center; gap: 8px; cursor: pointer; background: #161b22; padding: 4px 10px 4px 4px; border-radius: 20px; border: 1px solid var(--border-color); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; justify-content: center; align-items: center; font-weight: 800; }
  .username { font-size: 13px; font-weight: 600; }
  .profile-dropdown { position: absolute; top: 45px; right: 0; width: 180px; background: #1a2029; border: 1px solid var(--border-color); border-radius: 12px; display: none; z-index: 60; }
  .profile-dropdown.active { display: block; }
  .dropdown-item { padding: 12px 16px; font-size: 14px; cursor: pointer; } .dropdown-item.danger { color: var(--red); }
  .settings-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
  
  /* ОСНОВА */
  .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; width: 100%; }
  .title { font-size: 22px; font-weight: 700; text-align: center; } .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; text-align: center; }
  
  /* ВКЛАДКИ АПГРЕЙДА */
  .up-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
  .up-tab { flex: 1; background: #161b22; border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; transition: 0.2s; }
  .up-tab.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  
  /* СЛОТЫ АПГРЕЙДА */
  .up-battleground { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; margin-bottom: 20px; }
  .up-slot { flex: 1; background: #161b22; border: 2px dashed var(--border-color); border-radius: 12px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; cursor: pointer; }
  .up-slot.filled { border-color: var(--yellow); border-style: solid; }
  .up-slot img { max-width: 100%; max-height: 60px; object-fit: contain; }
  .up-slot .name { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: center; }
  .up-slot .price { font-size: 12px; font-weight: bold; color: var(--yellow); }
  .up-arrow { font-size: 24px; color: var(--text-muted); }

  /* КОЛЕСО (Наверху) */
  .wheel-container { position: relative; width: 180px; height: 180px; margin: 20px auto 30px; border-radius: 50%; border: 8px solid #1f2733; }
  .circle { position: absolute; inset: 0; border-radius: 50%; background: #232b36; overflow: hidden; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(180deg, #ffea00 0%, var(--orange) 100%); transition: height 0.3s; }
  .wheel-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 2; width: 100%; }
  .wheel-text .percent { font-size: 26px; font-weight: 800; color: #fff; } .wheel-text .chance { font-size: 10px; color: #ccc; }
  .arrow-container { position: absolute; inset: -8px; pointer-events: none; z-index: 5; transform-origin: center center; }
  .arrow { position: absolute; top: 0; left: 50%; width: 14px; height: 18px; margin-left: -7px; clip-path: polygon(0% 0%, 100% 0%, 50% 100%); background: #fff; }

  /* МНОЖИТЕЛИ */
  .multipliers { display: flex; gap: 8px; width: 100%; margin-bottom: 20px; }
  .mult-btn { flex: 1; background: #161b22; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 0; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .mult-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  
  /* КНОПКА */
  .action-area { position: relative; height: 60px; display: flex; width: 100%; gap: 10px; margin-bottom: 20px; }
  .btn-main { flex: 1; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; color: #000; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); cursor: pointer; text-transform: uppercase; }
  .btn-main:disabled { opacity: 0.5; filter: grayscale(0.5); }
  .btn-light { width: 60px; height: 60px; border-radius: 12px; background: #1f2733; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .btn-light.active { color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 15px rgba(255,209,46,0.3); }

  /* МАГАЗИН */
  .shop-section { width: 100%; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-top: 15px; }
  .inv-tabs-shop { display: flex; gap: 10px; margin-bottom: 15px; background: #12161c; padding: 4px; border-radius: 8px; }
  .inv-tab-shop { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
  .inv-tab-shop.active { background: #30363d; color: #fff; }
  .search-box { display: flex; align-items: center; background: #12161c; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
  .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; }
  
  .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; min-height: 200px; }
  .skin-card { background: #161b22; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; text-align: left; display: flex; flex-direction: column; position: relative; cursor: pointer; }
  .skin-card::after { content: ''; position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: #ff3b3b; border-radius: 2px; }
  .skin-image { height: 50px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
  .skin-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .skin-name { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-subname { font-size: 11px; font-weight: 700; color: #ff5c5c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skin-price { color: var(--yellow); font-weight: 700; font-size: 11px; margin-top: auto; text-align: right; }

  /* БУТЫЛОЧКА */
  .bottle-wrapper { position: relative; width: 100%; max-width: 320px; height: 320px; margin: 20px auto 40px; display: flex; justify-content: center; align-items: center; }
  .bottle-circle { position: absolute; width: 90%; height: 90%; border-radius: 50%; border: 1px dashed #30363d; }
  .bottle-center { position: absolute; width: 140px; height: 140px; background: radial-gradient(circle, #ffd12e 0%, #ff7a00 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 60px rgba(255, 209, 46, 0.6); z-index: 10; transition: transform 0.1s; }
  .bottle-center svg { width: 70px; height: 70px; fill: #fff; }
  .bottle-item { position: absolute; width: 60px; height: 60px; background: #1a2029; border: 1px solid var(--border-color); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 700; z-index: 5; }
  .bottle-item.win { color: var(--green); } .bottle-item.lose { color: var(--red); }
  .pos-1 { top: -10px; left: 50%; transform: translate(-50%, 0); } .pos-2 { top: 15%; right: -10px; } .pos-3 { bottom: 15%; right: -10px; } .pos-4 { bottom: -10px; left: 50%; transform: translate(-50%, 0); } .pos-5 { bottom: 15%; left: -10px; } .pos-6 { top: 15%; left: -10px; }
  .spin-bottle-btn { width: 100%; max-width: 340px; background: linear-gradient(90deg, #ffd12e 0%, #ff9d00 100%); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; }
  
  /* НАВИГАЦИЯ */
  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--nav-bg); border-top: 1px solid #1f2733; display: flex; justify-content: space-around; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; gap: 4px; cursor: pointer; width: 50%; }
  .nav-item svg { width: 24px; height: 24px; fill: currentColor; } .nav-item.active { color: var(--yellow); }
  .page-section { display: none; width: 100%; flex-direction: column; align-items: center; } .page-section.active { display: flex; }
  
  /* МОДАЛКИ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; visibility: hidden; transition: 0.3s; padding: 20px; }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal { background: #1a2029; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .close-modal { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
  .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  .auth-form { display: flex; flex-direction: column; gap: 15px; }
  .auth-form input { width: 100%; padding: 14px; background: #12161c; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }
  .save-settings-btn { width: 100%; background: var(--yellow); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="switchTab('upgrade')">Skin<span>Up</span></div>
    <div class="header-actions">
      <div class="balance-box">Баланс: <strong id="balanceVal">0</strong> G</div>
      <button class="auth-btn-header" id="headerLoginBtn">Войти</button>
      <div class="user-profile-btn" id="headerUserProfile">
        <div class="avatar" id="userAvatar">U</div>
        <div class="username" id="userName">User</div>
      </div>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="dropdown-item danger" id="logoutBtn">🚪 Выйти</div>
      </div>
      <button class="settings-btn" onclick="openModal('settingsModal')">⚙️</button>
    </div>
  </header>

  <!-- АПГРЕЙД -->
  <main class="main-content page-section active" id="page-upgrade">
    <h1 class="title" style="margin-bottom: 15px;">Апгрейдер</h1>
    
    <div class="up-tabs">
      <div class="up-tab active" id="tabBetBtn" onclick="switchUpTab('bet')">Ваш инвентарь</div>
      <div class="up-tab" id="tabTargetBtn" onclick="switchUpTab('target')">Прокачать до</div>
    </div>

    <div class="up-battleground">
      <div class="up-slot" id="betSlot" onclick="switchUpTab('bet')">
        <span style="color:var(--text-muted); font-size:11px;">Выберите скин</span>
      </div>
      <div class="up-arrow">➜</div>
      <div class="up-slot" id="targetSlot" onclick="switchUpTab('target')">
        <span style="color:var(--text-muted); font-size:11px;">Выберите цель</span>
      </div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-container" id="upWheel">
      <div class="circle">
        <div class="fill" id="fillEl" style="height: 0%;"></div>
        <div class="wheel-text">

    </div>

    <!-- МНОЖИТЕЛИ -->
    <div class="multipliers">
      <button class="mult-btn" data-mult="1.3">x1.3</button>
      <button class="mult-btn active" data-mult="2">x2</button>
      <button class="mult-btn" data-mult="2.8">x2.8</button>
      <button class="mult-btn" data-mult="4">x4</button>
      <button class="mult-btn" data-mult="5">x5</button>
    </div>

    <div class="action-area" id="actionArea">
      <button class="btn-main" id="upgradeBtn" disabled>Прокачать</button>
      <button class="btn-light active" id="upgradeLightning" onclick="toggleLightning('upgrade')">⚡</button>
      <div class="notification" id="notificationEl"></div>
    </div>

    <div class="shop-section" id="shopUpgrade">
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Поиск..." id="searchInputUp" oninput="renderItems('upgrade')"></div>
      <div id="shopContentUp"><div class="skin-grid" id="shopGridUp"></div></div>
    </div>
  </main>

  <!-- БУТЫЛКА -->
  <main class="main-content page-section" id="page-bottle">
    <h1 class="title">Бутылочка</h1>
    <p class="subtitle">Испытай удачу и сорви джекпот!</p>
    <div class="bottle-wrapper">
      <div class="bottle-circle"></div>
      <div class="bottle-center" id="bottleCenter"><svg viewBox="0 0 24 24"><path d="M11 2h2v4.5l2.5 2.5c.4.4.5.9.5 1.5v9c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-9c0-.6.2-1.1.5-1.5L11 6.5V2zm-1 8.5v9h4v-9h-4z"/></svg></div>
      <div class="bottle-item pos-1 win" id="b-item-1">23%</div><div class="bottle-item pos-2 win" id="b-item-2">23%</div><div class="bottle-item pos-3 win" id="b-item-3">23%</div>
      <div class="bottle-item pos-4 lose" id="b-item-4">10%</div><div class="bottle-item pos-5 lose" id="b-item-5">20%</div><div class="bottle-item pos-6 lose" id="b-item-6">1%</div>
    </div>
    <button class="spin-bottle-btn" id="spinBottleBtn" disabled>КРУТИТЬ (100 G)</button>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" onclick="switchTab('upgrade')" id="nav-upgrade"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg><span>Апгрейд</span></a>
    <a class="nav-item" onclick="switchTab('bottle')" id="nav-bottle"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>Бутылка</span></a>
  </nav>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <div class="modal-header"><h2>Аккаунт</h2><button class="close-modal" onclick="closeModal('authModal')">×</button></div>
      <div class="auth-tabs"><div class="auth-tab active" id="tabLogin">Вход</div><div class="auth-tab" id="tabRegister">Регистрация</div></div>
      <form class="auth-form" id="loginForm"><input type="text" id="loginNick" placeholder="Ваш Никнейм" required><input type="password" id="loginPass" placeholder="Пароль" required><button type="submit" class="save-settings-btn">Войти</button></form>
      <form class="auth-form" id="registerForm" style="display: none;"><input type="text" id="regNick" placeholder="Придумайте Никнейм" required><input type="password" id="regPass" placeholder="Придумайте Пароль" required><button type="submit" class="save-settings-btn">Зарегистрироваться</button></form>
    </div>
  </div>

    { name: "M4", sub: "N-Kai", price: 2997.00, img: "images/m4-n-kai.png" },
    { name: "FAMAS", sub: "Fury", price: 3099.98, img: "images/famas-fury.png" },
    { name: "AWM", sub: "Ravage", price: 3374.00, img: "images/awm-ravage.png" },
    { name: "M4", sub: "Wildstyle", price: 3800.00, img: "images/m4-wildstyle.png" },
    { name: "Desert Eagle", sub: "Yakuza", price: 3890.00, img: "images/desert-eagle-yakuza.png" },
    { name: "AWM", sub: "2 Years Red", price: 16500.00, img: "images/awm-2-years-red.png" },
    { name: "AKR", sub: "Treasure Hunter", price: 78887.00, img: "images/akr-treasure-hunter.png" }
  ];

  let state = {
    currentUser: null,
    users: JSON.parse(localStorage.getItem('skinup_users')) || {},
    upBet: null, upTarget: null, isSpinningUp: false, isFastUp: true,
    currentBuySkin: null, buyQty: 1, currentPage: 'upgrade', currentUpTab: 'bet'
  };

  const savedSession = localStorage.getItem('skinup_session');
  if (savedSession && state.users[savedSession]) state.currentUser = savedSession;

  function saveUsers() { localStorage.setItem('skinup_users', JSON.stringify(state.users)); }

  function updateUI() {
    if (state.currentUser) {
      document.getElementById('balanceVal').textContent = Math.round(state.users[state.currentUser].balance);
      document.getElementById('headerLoginBtn').style.display = 'none';
      document.getElementById('headerUserProfile').style.display = 'flex';
      document.getElementById('userName').textContent = state.currentUser;
      document.getElementById('userAvatar').textContent = state.currentUser.charAt(0).toUpperCase();
    } else {
      document.getElementById('balanceVal').textContent = '0';
      document.getElementById('headerLoginBtn').style.display = 'block';
      document.getElementById('headerUserProfile').style.display = 'none';
    }
    updateUpgradeUI();
    renderItems(state.currentPage);
  }

  window.switchTab = (tabId) => {
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`page-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');
    state.currentPage = tabId;
  };

  window.switchUpTab = (tab) => {
    state.currentUpTab = tab;
    document.getElementById('tabBetBtn').classList.toggle('active', tab === 'bet');
    document.getElementById('tabTargetBtn').classList.toggle('active', tab === 'target');
    switchShopTab('shop', 'upgrade');
  };

  window.switchShopTab = (tab, page) => {
    // Заглушка для магазина, так как он встроен в страницу Апгрейда
  };

  function updateUpgradeUI() {
    const betSlot = document.getElementById('betSlot');
    const targetSlot = document.getElementById('targetSlot');
    const wheel = document.getElementById('upWheel');
    const btn = document.getElementById('upgradeBtn');

    if (state.upBet) {
      betSlot.innerHTML = `<img src="${state.upBet.img}"><div class="name">${state.upBet.name}</div><div class="price">${state.upBet.price.toFixed(0)} G</div>`;
      betSlot.classList.add('filled');
    } else {
      betSlot.innerHTML = `<span style="color:var(--text-muted); font-size:11px;">Выберите скин</span>`;
      betSlot.classList.remove('filled');
    }

    if (state.upTarget) {
      targetSlot.innerHTML = `<img src="${state.upTarget.img}"><div class="name">${state.upTarget.name}</div><div class="price">${state.upTarget.price.toFixed(0)} G</div>`;
      targetSlot.classList.add('filled');
    } else {
      targetSlot.innerHTML = `<span style="color:var(--text-muted); font-size:11px;">Выберите цель</span>`;
      targetSlot.classList.remove('filled');
    }

    if (state.upBet && state.upTarget) {
      let chance = (state.upBet.price / state.upTarget.price) * 100;
      if (chance > 100) chance = 100;
      document.getElementById('percentEl').textContent = `${chance.toFixed(1)}%`;
      document.getElementById('fillEl').style.height = `${chance}%`;
      btn.disabled = state.isSpinningUp;
    } else {
      document.getElementById('percentEl').textContent = `0%`;
      document.getElementById('fillEl').style.height = `0%`;
      btn.disabled = true;
    }
  }

  window.toggleLightning = (type) => {
    if (type === 'upgrade') {
      state.isFastUp = !state.isFastUp;
      document.getElementById('upgradeLightning').classList.toggle('active', state.isFastUp);
    }
  };

  function renderItems(page) {
    const grid = document.getElementById('shopGridUp');
    if(!grid) return;
    
    const search = document.getElementById('searchInputUp').value.toLowerCase();
    grid.innerHTML = '';

    let items = allSkins;
    if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || i.sub.toLowerCase().includes(search));

    items.forEach((skin, idx) => {
      const card = document.createElement('div');
      card.className = 'skin-card';
      
      card.onclick = () => {
        if (state.currentUpTab === 'target') {
           state.upTarget = skin;
           switchUpTab('bet');
        } else {
           // Если выбрали "Ваш инвентарь", но у нас нет вкладки, просто выдаем ошибку или ставим в ставку
           if (state.upBet) state.upBet = null;
           state.upBet = skin;
           switchUpTab('target');
        }
        updateUI();
      };

      card.innerHTML = `
        <div class="skin-image"><img src="${skin.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0xNCA0bC0yIDItMy0zLTItMi01IDUgMiA1IDMgMyAyLTJ6Ii8+PC9zdmc+'"></div>
        <div class="skin-name">${skin.name}</div>
        <div class="skin-subname">${skin.sub}</div>
        <div class="skin-price">${skin.price.toFixed(0)} G</div>
      `;
      grid.appendChild(card);
    });
  }

  document.getElementById('upgradeBtn').addEventListener('click', () => {
    if (state.isSpinningUp || !state.upBet || !state.upTarget) return;
    state.isSpinningUp = true;
    
    let chance = (state.upBet.price / state.upTarget.price) * 100;
    if (chance > 100) chance = 100;
    const isWin = Math.random() * 100 < chance;
    const duration = state.isFastUp ? 500 : 3000;

    const arrow = document.getElementById('arrowContainer');
    arrow.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.8, 0.2, 1)`;
    
    const spins = state.isFastUp ? 2 : 5;
    arrow.style.transform = `rotate(${spins * 360 + (isWin ? 180 : 0)}deg)`;
    
    document.getElementById('upgradeBtn').textContent = 'Крутим...';
    
    setTimeout(() => {
      arrow.style.transition = 'none';
      arrow.style.transform = 'rotate(0deg)';
      
      if (isWin) {
        alert(`Победа! Получен ${state.upTarget.name}`);
      } else {
        alert(`Поражение`);
      }

      state.upBet = null;
      state.upTarget = null;
      state.isSpinningUp = false;
      
      document.getElementById('upgradeBtn').textContent = 'Прокачать';
      updateUI();
    }, duration);
  });

  window.openModal = (id) => document.getElementById(id).classList.add('active');
  window.closeModal = (id) => document.getElementById(id).classList.remove('active');

  document.getElementById('headerLoginBtn').addEventListener('click', () => openModal('authModal'));
  
  document.getElementById('tabLogin').addEventListener('click', () => {
    document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
    document.getElementById('loginForm').style.display = 'flex'; document.getElementById('registerForm').style.display = 'none';
  });
  document.getElementById('tabRegister').addEventListener('click', () => {
    document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('registerForm').style.display = 'flex'; document.getElementById('loginForm').style.display = 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('loginNick').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!state.users[nick] || state.users[nick].pass !== pass) return alert('Неверный ник или пароль!');
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = document.getElementById('regNick').value.trim();
    const pass = document.getElementById('regPass').value;
    if (state.users[nick]) return alert('Этот ник уже занят!');
    state.users[nick] = { pass: pass, balance: 1000, inventory: [] };
    saveUsers();
    state.currentUser = nick;
    localStorage.setItem('skinup_session', nick);
    closeModal('authModal');
    updateUI();
  });

  updateUI();
});
</script>
</body>
</html>
